worker_processes auto;
events { worker_connections 1024; }

http {
  limit_req_zone $binary_remote_addr zone=application_limit:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=application_admin_limit:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=admin_login_limit:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=student_login_limit:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=student_register_limit:10m rate=3r/m;
  limit_req_zone $binary_remote_addr zone=student_verification_limit:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=student_verification_resend_limit:10m rate=2r/m;
  limit_req_zone $binary_remote_addr zone=student_portal_limit:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=mentor_login_limit:10m rate=5r/m;

  upstream auth_up        { server auth-service:8000; }
  upstream application_up { server application-service:8000; }
  upstream people_up      { server people-service:8000; }
  upstream content_up     { server content-service:8000; }
  upstream frontend_up    { server frontend:3000; }

  map $scheme $hsts_header {
    https "max-age=31536000; includeSubDomains";
    default "";
  }

  server {
    listen 80;
    server_name _;
    server_tokens off;
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security $hsts_header always;
    server_tokens off;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/auth/student/login {
      limit_req zone=student_login_limit burst=3 nodelay;
      limit_req_status 429;
      proxy_pass http://auth_up/student/login;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/auth/student/register {
      limit_req zone=student_register_limit burst=2 nodelay;
      limit_req_status 429;
      proxy_pass http://auth_up/student/register;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/auth/mentor/login {
      limit_req zone=mentor_login_limit burst=3 nodelay;
      limit_req_status 429;
      proxy_pass http://auth_up/mentor/login;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/auth/teacher/login {
      limit_req zone=mentor_login_limit burst=3 nodelay;
      limit_req_status 429;
      proxy_pass http://auth_up/teacher/login;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/auth/login {
      limit_req zone=admin_login_limit burst=2 nodelay;
      limit_req_status 429;
      proxy_pass http://auth_up/login;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/auth/student/verification/confirm {
      limit_req zone=student_verification_limit burst=3 nodelay;
      limit_req_status 429;
      proxy_pass http://auth_up/student/verification/confirm;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/auth/student/verification/resend {
      limit_req zone=student_verification_resend_limit burst=1 nodelay;
      limit_req_status 429;
      proxy_pass http://auth_up/student/verification/resend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/auth/ {
      proxy_pass http://auth_up/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/application/admin/ {
      limit_req zone=application_admin_limit burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://application_up/admin/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/application/student/ {
      limit_req zone=student_portal_limit burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://application_up/student/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/application/mentor/ {
      limit_req zone=student_portal_limit burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://application_up/mentor/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/application/teacher/ {
      limit_req zone=student_portal_limit burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://application_up/teacher/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/api/application/(student|mentor|teacher|admin)/(messages/threads/[0-9]+/ws)$ {
      rewrite ^/api/application/(student|mentor|teacher|admin)/(messages/threads/[0-9]+/ws)$ /$1/$2 break;
      proxy_pass http://application_up;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }
    location /api/application/ {
      client_max_body_size 32k;
      limit_req zone=application_limit burst=3 nodelay;
      limit_req_status 429;

      proxy_pass http://application_up/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/people/ {
      proxy_pass http://people_up/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ^~ /api/content/student/ {
      limit_req zone=student_portal_limit burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://content_up/student/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/content/ {
      client_max_body_size 6m;
      proxy_pass http://content_up/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
      proxy_pass http://frontend_up;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
