services:
  postgres:
    image: postgres:16-alpine
    container_name: chekad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-chekad_auth}
      AUTH_DB_MIGRATOR: ${AUTH_DB_MIGRATOR:-chekad_auth_migrator}
      AUTH_DB_MIGRATOR_PASSWORD: ${AUTH_DB_MIGRATOR_PASSWORD:?Set AUTH_DB_MIGRATOR_PASSWORD in .env}
      AUTH_DB_USER: ${AUTH_DB_USER:-chekad_auth_app}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      APP_DB_NAME: ${APP_DB_NAME:-chekad_application}
      APP_DB_MIGRATOR: ${APP_DB_MIGRATOR:-chekad_application_migrator}
      APP_DB_MIGRATOR_PASSWORD: ${APP_DB_MIGRATOR_PASSWORD:?Set APP_DB_MIGRATOR_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-chekad_application_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      PEOPLE_DB_NAME: ${PEOPLE_DB_NAME:-chekad_people}
      PEOPLE_DB_MIGRATOR: ${PEOPLE_DB_MIGRATOR:-chekad_people_migrator}
      PEOPLE_DB_MIGRATOR_PASSWORD: ${PEOPLE_DB_MIGRATOR_PASSWORD:?Set PEOPLE_DB_MIGRATOR_PASSWORD in .env}
      PEOPLE_DB_USER: ${PEOPLE_DB_USER:-chekad_people_app}
      PEOPLE_DB_PASSWORD: ${PEOPLE_DB_PASSWORD:?Set PEOPLE_DB_PASSWORD in .env}
      CONTENT_DB_NAME: ${CONTENT_DB_NAME:-chekad_content}
      CONTENT_DB_MIGRATOR: ${CONTENT_DB_MIGRATOR:-chekad_content_migrator}
      CONTENT_DB_MIGRATOR_PASSWORD: ${CONTENT_DB_MIGRATOR_PASSWORD:?Set CONTENT_DB_MIGRATOR_PASSWORD in .env}
      CONTENT_DB_USER: ${CONTENT_DB_USER:-chekad_content_app}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:?Set CONTENT_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - chekad
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate-auth:
    image: chekad-auth:local
    build: ./services/auth
    container_name: chekad-migrate-auth
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DB_URL: postgresql+psycopg2://${AUTH_DB_MIGRATOR:-chekad_auth_migrator}:${AUTH_DB_MIGRATOR_PASSWORD}@postgres:5432/${AUTH_DB_NAME:-chekad_auth}
      MIGRATION_DB_URL: postgresql+psycopg2://${AUTH_DB_MIGRATOR:-chekad_auth_migrator}:${AUTH_DB_MIGRATOR_PASSWORD}@postgres:5432/${AUTH_DB_NAME:-chekad_auth}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      JWT_ISSUER: ${JWT_ISSUER:-chekad-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-chekad-admin}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [chekad]

  migrate-application:
    image: chekad-application:local
    build: ./services/application
    container_name: chekad-migrate-application
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DB_URL: postgresql+psycopg2://${APP_DB_MIGRATOR:-chekad_application_migrator}:${APP_DB_MIGRATOR_PASSWORD}@postgres:5432/${APP_DB_NAME:-chekad_application}
      MIGRATION_DB_URL: postgresql+psycopg2://${APP_DB_MIGRATOR:-chekad_application_migrator}:${APP_DB_MIGRATOR_PASSWORD}@postgres:5432/${APP_DB_NAME:-chekad_application}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [chekad]

  migrate-people:
    image: chekad-people:local
    build: ./services/people
    container_name: chekad-migrate-people
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DB_URL: postgresql+psycopg2://${PEOPLE_DB_MIGRATOR:-chekad_people_migrator}:${PEOPLE_DB_MIGRATOR_PASSWORD}@postgres:5432/${PEOPLE_DB_NAME:-chekad_people}
      MIGRATION_DB_URL: postgresql+psycopg2://${PEOPLE_DB_MIGRATOR:-chekad_people_migrator}:${PEOPLE_DB_MIGRATOR_PASSWORD}@postgres:5432/${PEOPLE_DB_NAME:-chekad_people}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [chekad]

  migrate-content:
    image: chekad-content:local
    build: ./services/content
    container_name: chekad-migrate-content
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DB_URL: postgresql+psycopg2://${CONTENT_DB_MIGRATOR:-chekad_content_migrator}:${CONTENT_DB_MIGRATOR_PASSWORD}@postgres:5432/${CONTENT_DB_NAME:-chekad_content}
      MIGRATION_DB_URL: postgresql+psycopg2://${CONTENT_DB_MIGRATOR:-chekad_content_migrator}:${CONTENT_DB_MIGRATOR_PASSWORD}@postgres:5432/${CONTENT_DB_NAME:-chekad_content}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [chekad]

  auth-service:
    image: chekad-auth:local
    # Image is built by the matching migrate-* service.
    container_name: chekad-auth
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth-service
      SERVICE_PORT: 8000
      DB_URL: postgresql+psycopg2://${AUTH_DB_USER:-chekad_auth_app}:${AUTH_DB_PASSWORD}@postgres:5432/${AUTH_DB_NAME:-chekad_auth}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      JWT_ISSUER: ${JWT_ISSUER:-chekad-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-chekad-admin}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:-http://localhost:8080}
      STUDENT_REGISTRATION_ENABLED: ${STUDENT_REGISTRATION_ENABLED:-false}
      APP_ENV: ${APP_ENV:-development}
      PEOPLE_INTERNAL_URL: http://people-service:8000
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
    networks: [chekad]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  application-service:
    image: chekad-application:local
    # Image is built by the matching migrate-* service.
    container_name: chekad-application
    restart: unless-stopped
    environment:
      SERVICE_NAME: application-service
      SERVICE_PORT: 8000
      APP_ENV: ${APP_ENV:-development}
      AUTH_INTERNAL_URL: http://auth-service:8000
      PEOPLE_INTERNAL_URL: http://people-service:8000
      DB_URL: postgresql+psycopg2://${APP_DB_USER:-chekad_application_app}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME:-chekad_application}
      PUBLIC_APPLICATIONS_ENABLED: ${PUBLIC_APPLICATIONS_ENABLED:-true}
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:-http://localhost:8080}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      PRIVACY_CONTACT_PHONE: ${PRIVACY_CONTACT_PHONE:-09918891553}
      PRIVACY_CONTACT_TELEGRAM: ${PRIVACY_CONTACT_TELEGRAM:-alirf11}
      TERMS_APPROVED: ${TERMS_APPROVED:-true}
      PURGE_APPLICATIONS_AFTER_DAYS: ${PURGE_APPLICATIONS_AFTER_DAYS:-365}
    depends_on:
      migrate-application:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      people-service:
        condition: service_healthy
    networks: [chekad]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  application-retention:
    image: chekad-application:local
    container_name: chekad-application-retention
    restart: unless-stopped
    command: ["sh", "-c", "while true; do python -m app.purge_expired_applications; sleep 86400; done"]
    environment:
      SERVICE_NAME: application-retention
      DB_URL: postgresql+psycopg2://${APP_DB_USER:-chekad_application_app}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME:-chekad_application}
      PURGE_APPLICATIONS_AFTER_DAYS: ${PURGE_APPLICATIONS_AFTER_DAYS:-365}
    depends_on:
      application-service:
        condition: service_healthy
    networks: [chekad]

  people-service:
    image: chekad-people:local
    # Image is built by the matching migrate-* service.
    container_name: chekad-people
    restart: unless-stopped
    environment:
      SERVICE_NAME: people-service
      SERVICE_PORT: 8000
      DB_URL: postgresql+psycopg2://${PEOPLE_DB_USER:-chekad_people_app}:${PEOPLE_DB_PASSWORD}@postgres:5432/${PEOPLE_DB_NAME:-chekad_people}
      AUTH_INTERNAL_URL: http://auth-service:8000
    depends_on:
      migrate-people:
        condition: service_completed_successfully
    networks: [chekad]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  content-service:
    image: chekad-content:local
    # Image is built by the matching migrate-* service.
    container_name: chekad-content
    restart: unless-stopped
    volumes:
      - chekad_media:/data/media
    environment:
      SERVICE_NAME: content-service
      SERVICE_PORT: 8000
      DB_URL: postgresql+psycopg2://${CONTENT_DB_USER:-chekad_content_app}:${CONTENT_DB_PASSWORD}@postgres:5432/${CONTENT_DB_NAME:-chekad_content}
      AUTH_INTERNAL_URL: http://auth-service:8000
    depends_on:
      migrate-content:
        condition: service_completed_successfully
    networks: [chekad]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backup:
    image: postgres:16-alpine
    container_name: chekad-backup
    profiles: ["backup"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-chekad_auth}
      APP_DB_NAME: ${APP_DB_NAME:-chekad_application}
      PEOPLE_DB_NAME: ${PEOPLE_DB_NAME:-chekad_people}
      CONTENT_DB_NAME: ${CONTENT_DB_NAME:-chekad_content}
      AUTH_DB_MIGRATOR: ${AUTH_DB_MIGRATOR:-chekad_auth_migrator}
      APP_DB_MIGRATOR: ${APP_DB_MIGRATOR:-chekad_application_migrator}
      PEOPLE_DB_MIGRATOR: ${PEOPLE_DB_MIGRATOR:-chekad_people_migrator}
      CONTENT_DB_MIGRATOR: ${CONTENT_DB_MIGRATOR:-chekad_content_migrator}
      AUTH_DB_USER: ${AUTH_DB_USER:-chekad_auth_app}
      APP_DB_USER: ${APP_DB_USER:-chekad_application_app}
      PEOPLE_DB_USER: ${PEOPLE_DB_USER:-chekad_people_app}
      CONTENT_DB_USER: ${CONTENT_DB_USER:-chekad_content_app}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/backups
      - ./infra/backup:/scripts:ro
      - chekad_media:/data/media:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [chekad]

  frontend:
    build: ./frontend
    container_name: chekad-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: /api
      AUTH_INTERNAL_URL: http://auth-service:8000
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_APPLICATIONS_ENABLED: ${PUBLIC_APPLICATIONS_ENABLED:-true}
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:-http://localhost:8080}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      PRIVACY_CONTACT_PHONE: ${PRIVACY_CONTACT_PHONE:-09918891553}
      PRIVACY_CONTACT_TELEGRAM: ${PRIVACY_CONTACT_TELEGRAM:-alirf11}
      TERMS_APPROVED: ${TERMS_APPROVED:-true}
    networks: [chekad]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    image: nginx:1.27-alpine
    container_name: chekad-gateway
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      auth-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      people-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [chekad]

networks:
  chekad:
    driver: bridge

volumes:
  postgres_data:
  chekad_media:
