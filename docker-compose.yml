services:
  postgres:
    image: postgres:16-alpine
    container_name: chekad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${AUTH_DB_NAME},${APP_DB_NAME},${PEOPLE_DB_NAME},${CONTENT_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks: [chekad]
    ports: ["5432:5432"]

  auth-service:
    build: ./services/auth
    container_name: chekad-auth
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: auth-service
      SERVICE_PORT: 8000
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AUTH_DB_NAME}
    depends_on: [postgres]
    networks: [chekad]
    expose: ["8000"]

  application-service:
    build: ./services/application
    container_name: chekad-application
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: application-service
      SERVICE_PORT: 8000
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${APP_DB_NAME}
    depends_on: [postgres]
    networks: [chekad]
    expose: ["8000"]

  people-service:
    build: ./services/people
    container_name: chekad-people
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: people-service
      SERVICE_PORT: 8000
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${PEOPLE_DB_NAME}
    depends_on: [postgres]
    networks: [chekad]
    expose: ["8000"]

  content-service:
    build: ./services/content
    container_name: chekad-content
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: content-service
      SERVICE_PORT: 8000
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${CONTENT_DB_NAME}
    depends_on: [postgres]
    networks: [chekad]
    expose: ["8000"]

  frontend:
    build: ./frontend
    container_name: chekad-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: /api
    networks: [chekad]
    expose: ["3000"]

  gateway:
    image: nginx:1.27-alpine
    container_name: chekad-gateway
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["${GATEWAY_PORT}:80"]
    depends_on:
      - auth-service
      - application-service
      - people-service
      - content-service
      - frontend
    networks: [chekad]

networks:
  chekad:
    driver: bridge

volumes:
  postgres_data: