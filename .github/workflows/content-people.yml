name: Content and people API

on:
  push:
    branches: [main, "feat/content-admin-exams-mentors"]
    paths:
      - "services/content/**"
      - "services/people/**"
      - ".github/workflows/content-people.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/content/**"
      - "services/people/**"
      - ".github/workflows/content-people.yml"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [content, people]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      PYTHONPATH: ${{ github.workspace }}/services/${{ matrix.service }}
      DB_URL: sqlite:///./${{ matrix.service }}-migration.db
      MIGRATION_DB_URL: sqlite:///./${{ matrix.service }}-migration.db
      SERVICE_NAME: ${{ matrix.service }}-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Verify database migrations
        run: alembic upgrade head
      - run: pytest -q
