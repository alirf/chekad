name: CHEKAD quality checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, types and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript validation
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build

  application-service:
    name: Application API tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/application
    env:
      DB_URL: sqlite:///./application-test-default.db
      SERVICE_NAME: application-service
      PYTHONPATH: ${{ github.workspace }}/services/application
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install application and test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run API, privacy and migration tests
        run: python -m pytest -q
