name: CHEKAD quality checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, types and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript validation
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build

  auth-service:
    name: Authentication API tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    env:
      DB_URL: sqlite:///./auth-ci.db
      MIGRATION_DB_URL: sqlite:///./auth-migration-ci.db
      JWT_SECRET: test-only-student-auth-secret-with-more-than-32-bytes
      JWT_EXPIRE_MINUTES: "30"
      JWT_ISSUER: chekad-auth-tests
      JWT_AUDIENCE: chekad-admin
      AUTH_COOKIE_SECURE: "false"
      APP_ENV: test
      STUDENT_REGISTRATION_ENABLED: "true"
      PYTHONPATH: ${{ github.workspace }}/services/auth
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install auth and test dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify Alembic migrations
        run: alembic upgrade head
      - name: Run authentication API tests
        run: python -m pytest -q

  application-service:
    name: Application API tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/application
    env:
      DB_URL: sqlite:///./application-test-default.db
      SERVICE_NAME: application-service
      PYTHONPATH: ${{ github.workspace }}/services/application
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install application and test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run API, privacy and migration tests
        run: python -m pytest -q
