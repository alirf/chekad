name: Application API

on:
  push:
    branches: [main, "feat/phase-1-operational-readiness"]
    paths:
      - "services/application/**"
      - ".github/workflows/application.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/application/**"
      - ".github/workflows/application.yml"

jobs:
  application-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/application
    env:
      PYTHONPATH: ${{ github.workspace }}/services/application
      DB_URL: sqlite:///./application-test.db
      MIGRATION_DB_URL: sqlite:///./application-test.db
      SERVICE_NAME: application-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/application/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Verify database migrations
        run: alembic upgrade head
      - name: Run application service tests
        run: pytest -q
